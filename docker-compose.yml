services:
  qdigest:
    build: .
    image: qdigest:local
    container_name: qdigest
    ports:
      - "${QDIGEST_PORT:-80}:80"
    volumes:
      - .:/var/www/dream-team
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/login.php') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
