server {
    listen 80;
    server_name dream-team.local;
    root /var/www/dream-team;
    index index.php index.html;

    client_max_body_size 32m;

    location ^~ /data/ {
        deny all;
    }

    location = /employees.json { deny all; }
    location = /email_settings.json { deny all; }
    location = /header_date.txt { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-dream-team.sock;
    }
}
