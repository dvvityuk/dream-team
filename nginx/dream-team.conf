server {
    listen 80;
    server_name qdigest.ru www.qdigest.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dream-team;
        default_type text/plain;
    }

    location / {
        return 301 https://qdigest.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.qdigest.ru;

    include snippets/qdigest-ssl.conf;

    return 301 https://qdigest.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qdigest.ru;

    include snippets/qdigest-ssl.conf;
    include snippets/qdigest-site.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
}
