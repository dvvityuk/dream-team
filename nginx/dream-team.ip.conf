# Включать после выпуска сертификата на IP.
# До этого nginx -t падает: файлов в /etc/letsencrypt/live/193.109.84.46/ ещё нет.
# Не подключать nginx/dream-team.conf: он уводит браузер на https://qdigest.ru.

server {
    listen 80;
    server_name 193.109.84.46;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://193.109.84.46$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name 193.109.84.46;

    ssl_certificate /etc/letsencrypt/live/193.109.84.46/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/193.109.84.46/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/193.109.84.46/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:IpSSL:10m;
    ssl_session_tickets off;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 32m;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /dream-team/data/ { deny all; }
    location ^~ /dream-team/includes/ { deny all; }
    location ^~ /dream-team/nginx/ { deny all; }
    location ^~ /dream-team/postfix/ { deny all; }

    location ^~ /dream-team/images/ {
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    location ^~ /dream-team/img/ {
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    location ~ /\. { deny all; }

    location ~* ^/dream-team/.+\.(?:json|txt|md|log|ini|conf|ya?ml)$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/dream-team/.+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-dream-team.sock;
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param QDIGEST_HTTPS on;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }
}
