ssl_certificate /etc/letsencrypt/live/qdigest.ru/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/qdigest.ru/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/qdigest.ru/chain.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:QdigestSSL:10m;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
