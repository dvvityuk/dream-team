server {
    listen 80 default_server;
    server_name _;

    include snippets/qdigest-site.conf;

    location ^~ /docker/ { deny all; }
    location ^~ /postfix/ { deny all; }
    location ^~ /systemd/ { deny all; }
    location ~* \.(?:sh)$ { deny all; }
    location = /Dockerfile { deny all; }
    location = /docker-compose.yml { deny all; }
    location = /.dockerignore { deny all; }
}
